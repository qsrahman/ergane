[project]
name = "muagent"
version = "0.1.0"
description = "Minimal terminal chat agent built on the OpenAI Responses API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
muagent = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
