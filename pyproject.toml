[project]
name = "muagent"
version = "0.1.0"
description = "Minimal terminal chat agent built on the OpenAI Responses API"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Qazi Sami ur Rahman", email = "qsrahmans@gmail.com" }
]
dependencies = [
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
]

[project.scripts]
muagent = "muagent.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
