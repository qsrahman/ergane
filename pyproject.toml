[project]
name = "ergane"
version = "0.1.0"
description = "Minimal terminal chat agent built on the OpenAI Responses API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [
    { name = "Qazi Sami ur Rahman", email = "qsrahmans@gmail.com" }
]
dependencies = [
    "anyio>=4.16.0",
    "openai>=3.31.0",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.14.1",
]

[project.scripts]
ergane = "ergane.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3,<3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mcp>=2.3,<3",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.1",
]

[tool.uv.build-backend]
# Finder drops these into any folder it opens; they would ship in the wheel.
wheel-exclude = ["**/.DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A turn has no cap on its model calls, so a test that loops without the guard would
# never end: it fails after this many seconds instead.
timeout = 60

[tool.ruff]
# src/ and tests/ hold first-party modules (ergane, fake_api) for import sorting.
src = ["src", "tests"]

[tool.ruff.lint]
# A broad `except` must say it is meant (`# noqa: BLE001`), and a noqa that no longer
# silences anything must go.
extend-select = ["B905", "BLE001", "RUF100"]
